name: Build FilzaApplySandboxExt from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="./FilzaSlop-auth-ready.zip"
          test -f "$ZIP_FILE"
          rm -rf source
          mkdir source
          unzip -q "$ZIP_FILE" -d source
          PROJECT_DIR="source/FilzaSlop-main"
          test -f "$PROJECT_DIR/Makefile"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install build tools
        run: brew install ldid

      - name: Install Theos
        env:
          THEOS: "${{ runner.temp }}/theos"
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build arm64 and arm64e
        run: cd "$PROJECT_DIR" && make clean && make package FINALPACKAGE=1

      - name: Collect unsigned artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "$PROJECT_DIR/.theos/obj/debug/FilzaApplySandboxExt.dylib" artifacts/
          cp "$PROJECT_DIR/Makefile" artifacts/
          shasum -a 256 artifacts/* > artifacts/SHA256SUMS

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "FilzaApplySandboxExt-from-zip-${{ github.sha }}"
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
